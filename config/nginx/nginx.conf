worker_processes  1;

events {
  worker_connections  1024;
}

http {
  server {
    listen 80;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Baseline security headers. HSTS is safe to always emit — it only takes
    # effect when the browser receives it over an HTTPS connection, so it's
    # correct here even though TLS itself terminates upstream of this container.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Real 301s for the redirect-stub pages — Astro's static build can only emit
    # these as meta-refresh + 200, so the actual redirect has to happen here.
    location = /get-started { return 301 https://app.marylandinsights.com/; }
    location = /start-for-free { return 301 https://app.marylandinsights.com/; }
    location = /enterprise-support { return 301 https://cal.id/maryland-insights/partnership; }

    # Fingerprinted build assets are safe to cache aggressively — Astro changes
    # the filename on every content change.
    location ^~ /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # /.well-known/ must stay servable (security.txt, sitepins.json) — ^~ makes
    # this prefix match win over the dotfile-deny regex below regardless of order.
    location ^~ /.well-known/ {
      try_files $uri =404;
    }

    # Never serve any other dotfile.
    location ~ /\. {
      deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
            root /usr/share/nginx/html;
            internal;
    }

    location / {
            try_files $uri ${uri}.html $uri/index.html =404;
    }
  }
}
